{{- $images := (.Pkg.GetComponent "zarf-registry").Images }}
{{- $registry := (index $images 0).Name }}
{{- $proxy := (index $images 1).Name }}
image:
  reference: {{ printf "%s/%s%s" .State.Registry.Address (imageRepository $registry) (imageTagOrDigest $registry) | quote }}
proxy:
  image:
    reference: {{ printf "%s/%s%s" .State.Registry.SeedAddress (imageRepository $proxy) (imageTagOrDigest $proxy) | quote }}
  registry:
    image:
      reference: {{ printf "%s/%s%s" .State.Registry.SeedAddress (imageRepository $registry) (imageTagOrDigest $registry) | quote }}
