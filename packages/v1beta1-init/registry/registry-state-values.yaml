{{- $component := .Pkg.GetComponent "zarf-registry" }}
{{- $registry := $component.GetImageByID "registry" }}
{{- $proxy := $component.GetImageByID "proxy" }}
{{- $registrySuffix := printf ":%s" (default "latest" $registry.Tag) }}
{{- if $registry.Digest }}
{{- $registrySuffix = printf "@%s" $registry.Digest }}
{{- end }}
{{- $proxySuffix := printf ":%s" (default "latest" $proxy.Tag) }}
{{- if $proxy.Digest }}
{{- $proxySuffix = printf "@%s" $proxy.Digest }}
{{- end }}
image:
  reference: {{ printf "%s/%s%s" .State.Registry.Address (imageRepository $registry.Reference) $registrySuffix | quote }}
proxy:
  image:
    reference: {{ printf "%s/%s%s" .State.Registry.SeedAddress (imageRepository $proxy.Reference) $proxySuffix | quote }}
  registry:
    image:
      reference: {{ printf "%s/%s%s" .State.Registry.SeedAddress (imageRepository $registry.Reference) $registrySuffix | quote }}
