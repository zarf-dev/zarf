# Derive image settings from the packaged image, including build-time overrides.
{{- $image := (index (.Pkg.GetComponent "zarf-agent").Images 0).Name }}
image:
  reference: {{ printf "%s/%s%s" .State.Registry.Address (imageRepository $image) (imageTagOrDigest $image) | quote }}
secret:
  tlsCrt: {{ .State.Agent.Cert | quote }}
  tlsKey: {{ .State.Agent.Key | quote }}
