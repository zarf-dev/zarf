# Derive image settings from the packaged image, including build-time overrides.
{{- $image := (.Pkg.GetComponent "zarf-agent").GetImageByID "agent" }}
{{- $imageSuffix := printf ":%s" (default "latest" $image.Tag) }}
{{- if $image.Digest }}
{{- $imageSuffix = printf "@%s" $image.Digest }}
{{- end }}
image:
  reference: {{ printf "%s/%s%s" .State.Registry.Address (imageRepository $image.Reference) $imageSuffix | quote }}
secret:
  tlsCrt: {{ .State.Agent.Cert | quote }}
  tlsKey: {{ .State.Agent.Key | quote }}
