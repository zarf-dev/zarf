# Derive image settings from the packaged image, including build-time overrides.
{{- $image := (.Pkg.GetComponent "zarf-agent").GetImageByID "agent" }}
image:
  repository: {{ printf "%s/%s" .State.Registry.Address $image.Repository | quote }}
  tag: {{ $image.Tag | default "latest" | quote }}
  digest: {{ $image.Digest | quote }}
secret:
  tlsCrt: {{ .State.Agent.Cert | quote }}
  tlsKey: {{ .State.Agent.Key | quote }}
