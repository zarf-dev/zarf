{{ if .Values.proxy.enabled }}
{{- $hostNetwork := or (eq (include "proxy.hostNetwork" .) "true") .Values.proxy.injector.daemonSet.podTemplate.spec.hostNetwork .Values.ipv6Only }}
{{- $podSpec := omit .Values.proxy.injector.daemonSet.podTemplate.spec "containers" "volumes" "hostNetwork" "dnsPolicy" "restartPolicy" "priorityClassName" "tolerations" "securityContext" "terminationGracePeriodSeconds" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zarf-injector
  {{- with .Values.proxy.injector.daemonSet.metadata.labels }}
  labels:
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- with .Values.proxy.injector.daemonSet.metadata.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app: zarf-daemonset-injector
  template:
    metadata:
      labels:
        app: zarf-daemonset-injector
        # Don't mutate this pod
        zarf.dev/agent: ignore
        {{- with .Values.proxy.injector.daemonSet.podTemplate.metadata.labels }}
{{ toYaml . | indent 8 }}
        {{- end }}
      {{- with .Values.proxy.injector.daemonSet.podTemplate.metadata.annotations }}
      annotations:
{{ toYaml . | indent 8 }}
      {{- end }}
    spec:
    {{- with $podSpec }}
{{ toYaml . | indent 6 }}
    {{- end }}
      priorityClassName: {{ default "system-node-critical" .Values.proxy.injector.daemonSet.podTemplate.spec.priorityClassName }}
      containers:
        - name: injector
          image: "{{ .Values.proxy.injector.image }}"
          workingDir: /zarf-init
          command:
            - "/zarf-init/zarf-injector"
            - "{{ .Values.proxy.injector.shasum }}"
            - "{{ if .Values.ipv6Only }}[::]:{{ .Values.proxy.injector.hostPort }}{{ else }}0.0.0.0:{{ .Values.proxy.injector.hostPort }}{{ end }}"
          {{- $containerExtras := omit .Values.proxy.injector.daemonSet.podTemplate.container "name" "image" "workingDir" "command" "ports" "volumeMounts" "readinessProbe" "resources" "securityContext" }}
          {{- with $containerExtras }}
{{ toYaml . | indent 10 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.proxy.injector.hostPort }}
            {{- if not $hostNetwork }}
              hostPort: {{ .Values.proxy.injector.hostPort }}
              hostIP: "127.0.0.1"
            {{- end }}
          {{- if .Values.proxy.injector.daemonSet.podTemplate.container.readinessProbe }}
          readinessProbe:
{{ toYaml .Values.proxy.injector.daemonSet.podTemplate.container.readinessProbe | indent 12 }}
          {{- else }}
          readinessProbe:
            failureThreshold: 10
            httpGet:
              path: /v2/
              port: {{ .Values.proxy.injector.hostPort }}
              scheme: HTTP
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
          {{- end }}
          {{- if .Values.proxy.injector.daemonSet.podTemplate.container.resources }}
          resources:
{{ toYaml .Values.proxy.injector.daemonSet.podTemplate.container.resources | indent 12 }}
          {{- else }}
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 256Mi
          {{- end }}
          volumeMounts:
            - mountPath: /zarf-init/zarf-injector
              name: init
              subPath: zarf-injector
            - mountPath: /zarf-seed
              name: seed
            {{- range $i := until (int .Values.proxy.injector.payLoadConfigMapAmount) }}
            - mountPath: /zarf-init/zarf-payload-{{ printf "%03d" $i }}
              name: zarf-payload-{{ printf "%03d" $i }}
              subPath: zarf-payload-{{ printf "%03d" $i }}
            {{- end }}
          {{- if .Values.proxy.injector.daemonSet.podTemplate.container.securityContext }}
          securityContext:
{{ toYaml .Values.proxy.injector.daemonSet.podTemplate.container.securityContext | indent 12 }}
          {{- else }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          {{- end }}
    {{- if $hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
    {{- end }}
    {{- $tolerations := .Values.proxy.tolerations }}
    {{- if hasKey .Values.proxy.injector.daemonSet.podTemplate.spec "tolerations" }}
    {{- $tolerations = .Values.proxy.injector.daemonSet.podTemplate.spec.tolerations }}
    {{- end }}
    {{- with $tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
      terminationGracePeriodSeconds: {{ default 1 .Values.proxy.injector.daemonSet.podTemplate.spec.terminationGracePeriodSeconds }}
      {{- if .Values.proxy.injector.daemonSet.podTemplate.spec.securityContext }}
      securityContext:
{{ toYaml .Values.proxy.injector.daemonSet.podTemplate.spec.securityContext | indent 8 }}
      {{- else }}
      securityContext:
        fsGroup: 2000
        runAsGroup: 2000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      volumes:
        - configMap:
            defaultMode: 511
            name: rust-binary
          name: init
        - emptyDir: {}
          name: seed
        {{- range $i := until (int .Values.proxy.injector.payLoadConfigMapAmount) }}
        - configMap:
            defaultMode: 420
            name: zarf-payload-{{ printf "%03d" $i }}
          name: zarf-payload-{{ printf "%03d" $i }}
        {{- end }}
{{- end }}
