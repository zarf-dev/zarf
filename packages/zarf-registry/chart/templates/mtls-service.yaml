{{- if .Values.mtls.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: zarf-docker-registry-mtls
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app: {{ template "docker-registry.name" . }}
    release: {{ .Release.Name }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  ports:
    - name: https
      port: 5000
      protocol: TCP
      targetPort: {{ if .Values.proxy.enabled }}5000{{ else }}5002{{ end }}
  selector:
    app: {{ template "docker-registry.name" . }}
    release: {{ .Release.Name }}
{{- end }}
