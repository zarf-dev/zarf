{{- $name := "zarf-git-server-tls" -}}
{{- $ca := .Values.certificates.ca -}}
{{- $cert := .Values.certificates.cert -}}
{{- $key := .Values.certificates.key -}}
{{- $provided := and (ne (trim $ca) "") (ne (trim $cert) "") (ne (trim $key) "") -}}
{{- if and (or (ne (trim $ca) "") (ne (trim $cert) "") (ne (trim $key) "")) (not $provided) -}}
{{- fail "GIT_SERVER_TLS_CA, GIT_SERVER_TLS_CERT, and GIT_SERVER_TLS_KEY must be provided together" -}}
{{- end -}}
{{- if and .Values.certificates.required (not $provided) -}}
{{- fail "unable to load all Git server TLS certificate files" -}}
{{- end -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $rotation := .Values.rotation | default "" -}}
{{- $data := dict -}}
{{- if $provided -}}
  {{- $_ := set $data "ca.crt" ($ca | b64enc) -}}
  {{- $_ := set $data "tls.crt" ($cert | b64enc) -}}
  {{- $_ := set $data "tls.key" ($key | b64enc) -}}
{{- else if and $existing (eq (dig "metadata" "annotations" "zarf.dev/git-tls-rotation" "" $existing) $rotation) -}}
  {{- $data = $existing.data -}}
{{- else -}}
  {{- $generatedCA := genCA "Zarf Git Server CA" 375 -}}
  {{- $generatedCert := genSignedCert "zarf-gitea-http.zarf.svc.cluster.local" (list "127.0.0.1" "::1") (list "zarf-gitea-http" "zarf-gitea-http.zarf" "zarf-gitea-http.zarf.svc" "zarf-gitea-http.zarf.svc.cluster.local" "localhost") 375 $generatedCA -}}
  {{- $_ := set $data "ca.crt" ($generatedCA.Cert | b64enc) -}}
  {{- $_ := set $data "tls.crt" ($generatedCert.Cert | b64enc) -}}
  {{- $_ := set $data "tls.key" ($generatedCert.Key | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    zarf.dev/git-tls-rotation: {{ $rotation | quote }}
type: kubernetes.io/tls
data:
  ca.crt: {{ index $data "ca.crt" | quote }}
  tls.crt: {{ index $data "tls.crt" | quote }}
  tls.key: {{ index $data "tls.key" | quote }}
