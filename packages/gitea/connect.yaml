{{- $tlsEnabled := get .State.Git "TLSEnabled" | default false -}}
apiVersion: v1
kind: Service
metadata:
  name: zarf-connect-git
  labels:
    # Enables "zarf connect git"
    zarf.dev/connect-name: git
  annotations:
    zarf.dev/connect-description: "Internal Zarf Git Server (Gitea)"
    zarf.dev/connect-scheme: {{ ternary "https" "http" $tlsEnabled | quote }}
spec:
  ports:
  - port: 3000
