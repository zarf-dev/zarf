apiVersion: v1
kind: Service
metadata:
  name: zarf-connect-git
  labels:
    # Enables "zarf connect git"
    zarf.dev/connect-name: git
  annotations:
    zarf.dev/connect-description: "Internal Zarf Git Server (Gitea)"
    zarf.dev/connect-scheme: "###ZARF_GIT_SERVER_PROTOCOL###"
spec:
  ports:
  - port: 3000
