apiVersion: zarf.dev/v1beta1
kind: ZarfComponentConfig
metadata:
  name: zarf-injector
  description: |
    Bootstraps a Kubernetes cluster by cloning a running pod in the cluster and hosting the registry image.
    Removed and destroyed after the Zarf Registry is self-hosting the registry image.

values:
  files:
    - ../values.yaml
  schema: ../values-schema.json

component:
  import:
    local:
      - path: zarf-injector-common.yaml
  selector:
    architecture: arm64
  files:
    - source: https://github.com/zarf-dev/zarf-injector/releases/download/v0.3.0/zarf-injector-arm64
      destination: "{{ .Zarf.Temp }}/zarf-injector"
      checksum: "7a677809accc0d3d9b1cddc8d6be07ebf0a883a1db887e50828bb3df0e824577"
      executable: true
