apiVersion: zarf.dev/v1beta1
kind: ZarfComponentConfig
metadata:
  name: zarf-agent
  version: "[[ .cli.version ]]"
  description: Mutating webhook for container images and GitOps repository references
values:
  schema: values.schema.json
  files:
    - agent-values.yaml
component:
  service:
    name: agent
  stateAccess:
    - agentCerts
  images:
    - id: agent
      name: "[[ .agent.image ]]"
      source: "[[ .agent.source ]]"
  charts:
    - name: zarf-agent
      releaseName: zarf-d2db14ef40305397791454e883b26fc94ad9615d
      namespace: zarf
      local:
        path: ../../v1alpha1/zarf-agent/chart
      valuesFiles:
        - path: agent-state-values.yaml
          enableTemplating: true
      values:
        - sourcePath: .agent
          targetPath: .
