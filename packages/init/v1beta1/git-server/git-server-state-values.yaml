persistence:
  storageClass: {{ .State.StorageClass | quote }}
  create: {{ .Values.gitServer.persistence.create }}
gitea:
  admin:
    username: {{ .State.Git.PushUsername | quote }}
    password: {{ .State.Git.PushPassword | quote }}
image:
  fullOverride: {{ ((.Pkg.GetComponent "git-server").GetImageByID "git-server").Reference | quote }}
