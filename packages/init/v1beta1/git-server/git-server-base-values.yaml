# Fixed integration settings for Zarf's packaged internal Git server.
gitea:
  admin:
    email: zarf@localhost
  config:
    APP_NAME: Zarf Gitops Service
    server:
      DISABLE_SSH: true
      OFFLINE_MODE: true
      ROOT_URL: http://zarf-gitea-http.zarf.svc.cluster.local:3000
    database:
      DB_TYPE: sqlite3
      # Gitea's init script needs a reachable host even when SQLite stores data on disk.
      HOST: zarf-docker-registry.zarf.svc.cluster.local:5000
    security:
      INSTALL_LOCK: true
    repository:
      ENABLE_PUSH_CREATE_USER: true
      FORCE_PRIVATE: true
    session:
      PROVIDER: memory
    cache:
      ADAPTER: memory
    queue:
      TYPE: level
image:
  rootless: true
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
serviceAccount:
  create: true
  automountServiceAccountToken: false
postgresql-ha:
  enabled: false
valkey-cluster:
  enabled: false
strategy:
  type: Recreate
