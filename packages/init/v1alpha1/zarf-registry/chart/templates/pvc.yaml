{{- if .Values.persistence.enabled }}
{{- if not .Values.persistence.existingClaim -}}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ template "docker-registry.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app: {{ template "docker-registry.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- if .Values.persistence.storageClass }}
{{- if eq "-" .Values.persistence.storageClass }}
  storageClassName: ""
{{- else }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
{{- end }}
{{- else }}
{{- /* Preserve an immutable storage class on upgrade; new claims use the Kubernetes default. */}}
{{- $claim := lookup "v1" "PersistentVolumeClaim" .Release.Namespace (include "docker-registry.fullname" .) }}
{{- if and $claim (hasKey $claim.spec "storageClassName") }}
  storageClassName: {{ $claim.spec.storageClassName | quote }}
{{- end }}
{{- end }}
{{- end -}}
{{- end -}}
