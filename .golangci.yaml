version: "2"
linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - goheader
    - govet
    - ineffassign
    - nolintlint
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - unused
    - whitespace
  settings:
    staticcheck:
      checks: ["all", "-QF1008"]
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*github.com/spf13/cobra.Command).Help
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
        - (*github.com/spf13/pflag.FlagSet).MarkHidden
        - (*github.com/spf13/pflag.FlagSet).MarkDeprecated
        - fmt.Fprintln
        - fmt.Fprint
        - fmt.Fprintf
    goheader:
      template: |-
        SPDX-License-Identifier: Apache-2.0
        SPDX-FileCopyrightText: 2021-Present The Zarf Authors
    govet:
      disable:
        - shadow
        - fieldalignment
        - unusedwrite
        - printf
      enable-all: true
    nolintlint:
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - "disableStutteringCheck"
        - name: if-return
        - name: increment-decrement
        - name: var-naming
          arguments:
            - [] # allowlist
            - [] # blocklist
            - [{skipPackageNameChecks: true}] # options map
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    sloglint:
      no-mixed-args: true
      key-naming-case: camel
    testifylint:
      enable-all: true
  exclusions:
    presets:
      - common-false-positives
      - legacy
    rules:
      # Tests assert that deprecated fields stay in sync with their
      # replacements, so they have to read the deprecated field on purpose and
      # silence staticcheck for that line. Whether staticcheck reports the
      # deprecation at all varies between environments, and when it does not,
      # nolintlint reports the directive as unused and fails the build for code
      # that is correct either way.
      - path: _test\.go
        linters: [nolintlint]
        text: 'directive `//nolint:staticcheck'
    paths:
      - src/cmd/helm
      - third_party$
      - builtin$
      - examples$
      - vendor$
formatters:
  enable:
    - goimports
    - gofmt
  exclusions:
    paths:
      - src/cmd/helm
      - third_party$
      - builtin$
      - examples$
      - vendor$
