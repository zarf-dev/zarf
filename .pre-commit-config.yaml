repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # Upstream SQLite amalgamation; keep the size limit for other files.
        exclude: ^vendor/github\.com/mattn/go-sqlite3/sqlite3-binding\.c$
      - id: check-merge-conflict
      - id: detect-aws-credentials
        args:
          - "--allow-missing-credentials"
      - id: detect-private-key
        exclude: |
            (?x)^(
                src/test/e2e/29_config_file_test\.go|
                examples/longhorn/values\.yaml|
                # Upstream test-key fixtures.
                vendor/github\.com/ProtonMail/go-crypto/openpgp/keys_test_data\.go|
                vendor/github\.com/ProtonMail/go-crypto/openpgp/read_write_test_data\.go|
                vendor/github\.com/digitorus/pkcs7/verify_test_dsa\.go|
                # PEM delimiter strings, not private key material.
                vendor/github\.com/alibabacloud-go/openapi-util/service/service\.go
            )$
      - id: end-of-file-fixer
        exclude: |
            (?x)^(
                vendor/.*|
                src/internal/packager/images/testdata/.*|
                site/src/content/docs/commands/.*
            )$
      - id: fix-byte-order-marker
        exclude: vendor/.*
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: |
            (?x)^(
                vendor/.*|
                site/src/content/docs/commands/.*
            )$
  - repo: https://github.com/sirosen/texthooks
    rev: 72a68994497c827ced727b7c6b2567cfc5a96cb2  # 0.6.4
    hooks:
      - id: fix-smartquotes
        exclude: vendor/.*
  - repo: local
    hooks:
      - id: check-docs-and-schema
        name: Check for outdated docs and Zarf schema
        entry: ./hack/check-zarf-docs-and-schema.sh
        files: "src/types/types.go"
        types: [go]
        language: script
      - id: goimports
        name: goimports
        entry: golangci-lint fmt
        types: [go]
        language: system
        pass_filenames: false
      - id: lint
        name: golangci-lint go lint
        entry: golangci-lint run
        types: [go]
        language: system
        pass_filenames: false
