apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: package-flavors
  description: Simple example to show how to use the `selector.flavor` key to build package variants.
  version: 1.0.0

components:
  - name: image
    description: "Sets the Enterprise Linux flavor to Rocky Linux"
    selector:
      flavor: rocky-road
    images:
      - name: rockylinux:9-minimal
    actions:
      onDeploy:
        before:
          - cmd: echo "rockylinux:9-minimal"
            setValues:
              - key: .image

  - name: image
    description: "Sets the Enterprise Linux flavor to Oracle Linux"
    selector:
      flavor: oracle-cookie-crunch
    images:
      - name: oraclelinux:9-slim
    actions:
      onDeploy:
        before:
          - cmd: echo "oraclelinux:9-slim"
            setValues:
              - key: .image

  - name: image
    description: "Sets the Enterprise Linux flavor to Alma Linux"
    selector:
      flavor: vanilla-alma-nd
    images:
      - name: almalinux:9-minimal
    actions:
      onDeploy:
        before:
          - cmd: echo "almalinux:9-minimal"
            setValues:
              - key: .image

  - name: image
    description: "Sets the Enterprise Linux flavor to OpenSUSE"
    selector:
      flavor: strawberry-suse
    images:
      - name: opensuse/leap:15
    actions:
      onDeploy:
        before:
          - cmd: echo "opensuse/leap:15"
            setValues:
              - key: .image

  - name: pod
    description: "The pod that runs the specified flavor of Enterprise Linux"
    manifests:
      - name: enterprise-linux
        enableTemplating: true
        namespace: enterprise-linux
        files:
          - pod.yaml

attachments:
  readme: readme.md
