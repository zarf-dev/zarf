kind: ZarfPackageConfig
metadata:
  name: image-volume-archive
  description: Builds an image volume archive from a directory of files and ships it as an imageArchive
  version: 0.0.1

documentation:
  readme: readme.md

components:
  - name: docs-archive
    required: true
    description: Packs this site's built static output into an image volume archive and serves it with nginx
    actions:
      onCreate:
        before:
          # site/dist is generated and gitignored, so it has to be built before
          # it can be packed. The helper runs the same Astro build Netlify runs,
          # in a container pinned to netlify.toml's NODE_VERSION, so no local
          # Node install is required.
          - description: build the docs site
            cmd: ../../site/hack/build-in-docker.sh build
          # `zarf dev image-volume-archive` (alias `iva`) packs every file under
          # the given directory into an OCI image and writes it out as a
          # `docker save`-compatible tar. The tar name below is what the command
          # derives from the reference when --output is not passed. A
          # zarf.internal reference keeps the image from ever resolving to a
          # public registry, the same way examples/kiwix does.
          #
          # Unlike the Flux component below, no --max-layers cap is needed: a
          # pod mounting an image volume sees every layer flattened, so the
          # default batching across up to 127 layers is fine for a few thousand
          # files of built HTML and assets.
          - description: create image archive
            cmd: |-
              ./zarf dev iva ../../site/dist zarf.internal/zarf-docs:local
    images:
      - docker.io/library/nginx:1.29.2
    imageArchives:
      - images:
          - zarf.internal/zarf-docs:local
        path: zarf.internal_zarf-docs-local.tar
    manifests:
      - name: zarf-docs
        namespace: zarf-docs
        files:
          - nginx/configmap.yaml
          - nginx/deployment.yaml
          - nginx/service.yaml
  - name: fluxcd-oci-repo
    required: true
    actions:
      onCreate:
        before:
          - description: create image archive
            cmd: |-
              ./zarf dev iva --max-layers 1 fluxcd/podinfo zarf.internal/zarf-flux-podinfo:local
    images:
      - ghcr.io/stefanprodan/podinfo:6.15.0
    imageArchives:
      - images:
          - zarf.internal/zarf-flux-podinfo:local
        path: zarf.internal_zarf-flux-podinfo-local.tar
    manifests:
      - name: podinfo-namespace
        files:
          - fluxcd/deploy/ns-podinfo.yaml
        namespace: podinfo
      - name: podinfo-manifests
        kustomizations:
          - fluxcd/deploy
        namespace: flux-system
