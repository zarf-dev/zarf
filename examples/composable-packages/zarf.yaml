apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: composable-packages
  description: Import a reusable web server and serve different pages in separate namespaces

values:
  files:
    - values.yaml

components:
  - name: local-import
    description: Serve a page supplied by this package using a local web-server component
    import:
      local:
        - path: components/web-server.yaml
    charts:
      - name: web-server
        namespace: imports-local
        values:
          - sourcePath: .webServers.local
            targetPath: .

  - name: remote-import
    description: Serve a different page using the same component imported from a registry
    import:
      # FIXME: Publish components/web-server.yaml and replace this registry before creating the package.
      remote:
        - url: oci://ghcr.io/austinabro321/web-server:1.0.0
    charts:
      - name: web-server
        namespace: imports-remote
        values:
          - sourcePath: .webServers.remote
            targetPath: .

attachments:
  readme: readme.md
