apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: composable-packages
  description: Local, nested, and published component imports with resource overrides

components:
  - name: local-import
    description: Import a local component and extend its configuration
    import:
      local:
        - path: components/application.yaml
    manifests:
      # Matching names merge: namespace overrides the imported value, and files append.
      - name: configuration
        namespace: imports-local
        files:
          - manifests/local-settings.yaml

  - name: remote-import
    description: Import the published component into a separate namespace
    import:
      # Publish components/application.yaml first; see readme.md.
      remote:
        - url: oci://localhost:5000/application:1.0.0
    manifests:
      - name: configuration
        namespace: imports-remote

attachments:
  readme: readme.md
