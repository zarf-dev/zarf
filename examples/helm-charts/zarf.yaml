apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: helm-charts
  description: Example showcasing multiple ways to deploy helm charts
  version: 0.0.1

values:
  files:
    - package-values.yaml

components:
  - name: demo-helm-charts
    charts:
      # Charts are organized in a list with unique chart names per component - note that a Zarf chart name does not need to match the chart name in a Chart.yaml
      - name: podinfo-local
        # `local.path` loads the chart from the local filesystem.
        local:
          path: chart
        namespace: podinfo-from-local-chart
        valuesFiles:
          - path: values.yaml
        # serverSideApply is a new option in Helm 4
        # Can be set to true, false, and "auto". Defaults to "auto" which uses SSA on new installs, and automatically selects the previously apply method on upgrade
        serverSideApply: "true"
        # Values are used to override the default values in the chart.
        # This can be overridden by the user at deployment time with the `--set-values` flag.
        values:
          - sourcePath: ".podinfo.replicaCount"
            targetPath: ".replicaCount"

      - name: podinfo-oci
        # `oci.url` and `oci.ref` select a chart from an OCI registry.
        oci:
          url: oci://ghcr.io/stefanprodan/charts/podinfo
          ref:
            tag: 6.4.0
        namespace: podinfo-from-oci
        valuesFiles:
          - path: values.yaml

      - name: podinfo-git
        # `git.ref` selects the revision and `git.path` selects the chart directory.
        git:
          url: https://github.com/stefanprodan/podinfo.git
          ref:
            tag: 6.4.0
          path: charts/podinfo
        namespace: podinfo-from-git
        valuesFiles:
          - path: values.yaml

      - name: podinfo-repo
        # `helmRepository.name` selects the upstream chart independently of the Zarf chart name.
        helmRepository:
          url: https://stefanprodan.github.io/podinfo
          version: 6.4.0
          name: podinfo
        namespace: podinfo-from-repo
        # By default the release name will be the chart name, but you can override this with the `releaseName` key
        releaseName: cool-release-name
        valuesFiles:
          - path: values.yaml
    images:
      - name: ghcr.io/stefanprodan/podinfo:6.4.0
      # This is the cosign signature for the podinfo image for image signature verification
      - name: ghcr.io/stefanprodan/podinfo:sha256-57a654ace69ec02ba8973093b6a786faa15640575fbf0dbb603db55aca2ccec8.sig

attachments:
  readme: readme.md
