apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: config-file
  description: Test component to demonstrate using a config file to control the cli. Files are generated using "zarf dev generate-config"

values:
  files:
    - values.yaml
# FIXME: probably not the config files job to be doing templating and we should have a separate zarf dev template example
components:
  - name: lion
    description: By default, only this component will be deployed when using the config file
    manifests:
      - name: config-example-configmap
        enableTemplating: true
        files:
          - simple-configmap.yaml

  - name: zebra
    optional: true
    # Package templates are rendered by `zarf dev template` before package creation.
    description: "This is a zebra and they have [[ .zebra ]]"

  - name: leopard
    optional: true
    description: "This is a leopard and they have [[ .leopard ]]"

attachments:
  readme: readme.md
