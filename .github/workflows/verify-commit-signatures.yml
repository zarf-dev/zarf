name: Verify Commit Signatures

on:
  # pull_request_target runs the workflow from the base branch, so a PR cannot alter its own check.
  # This is safe because the job never checks out or executes PR code.
  pull_request_target:
    types: [opened, reopened, synchronize]
  merge_group:

permissions: {}

concurrency:
  group: commit-signatures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-commit-signatures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check PR commit signatures
        if: github.event_name == 'pull_request_target'
        # TODO: pin to the commit SHA once the action is merged into zarf-dev/actions.
        uses: zarf-dev/actions/verify-commit-signatures@main

      - name: Report merge queue status
        if: github.event_name == 'merge_group'
        # The check needs a PR payload; signature feedback runs before queuing.
        run: echo "Signature feedback runs on PRs; existing signed-commit rules apply when merging."
