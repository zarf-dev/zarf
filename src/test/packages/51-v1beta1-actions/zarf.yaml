apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: v1beta1-actions
components:
  - name: success
    actions:
      onDeploy:
        before:
          - cmd: printf beta-before
            setValues:
              - key: .message
                type: string
        onSuccess:
          - cmd: echo "{{ .Values.message }}-success"
            enableTemplating: true
  - name: failure
    actions:
      onDeploy:
        before:
          - cmd: "false"
        onFailure:
          - cmd: echo beta-failure-handled
