kind: ZarfPackageConfig
metadata:
  name: helm-charts
  description: Test package for skeleton OCI compose with Helm charts
  version: 0.0.1

components:
  - name: demo-helm-charts
    required: true
    charts:
      - name: local-configmap
        namespace: helm-chart-local
        version: 0.1.0
        localPath: chart
      - name: podinfo-oci
        namespace: podinfo-from-oci
        version: 6.4.0
        url: oci://ghcr.io/stefanprodan/charts/podinfo
    images:
      - ghcr.io/stefanprodan/podinfo:6.4.0
