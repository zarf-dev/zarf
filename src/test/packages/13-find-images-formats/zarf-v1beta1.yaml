apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: find-images-formats
components:
  - name: app
    import:
      local:
        - path: component.yaml
    images:
      - name: nginx:1.27
        id: web
        source: daemon
      - name: docker.io/library/nginx:1.27
        id: worker
        source: daemon
      - name: example.com/manual:1
        source: registry
